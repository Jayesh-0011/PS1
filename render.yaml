services:
  - type: web
    name: vendor-voice-api
    runtime: docker
    dockerfilePath: ./voice-service/Dockerfile
    dockerContext: ./voice-service
    healthCheckPath: /healthz
    envVars:
      - key: WHISPER_MODEL
        value: small
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      - key: ALLOWED_ORIGINS
        sync: false
